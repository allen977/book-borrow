<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>扫码借书系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    color: #333;
  }
  .container { max-width: 480px; margin: 0 auto; padding: 16px; }
  .header {
    text-align: center;
    padding: 32px 0 24px;
    color: #fff;
  }
  .header h1 { font-size: 28px; margin-bottom: 8px; }
  .header p { font-size: 14px; opacity: 0.8; }

  .tabs {
    display: flex;
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 20px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 12px;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .tab.active {
    background: linear-gradient(135deg, #667eea, #764ba2);
    box-shadow: 0 4px 15px rgba(102,126,234,0.4);
  }

  .card {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    display: none;
  }
  .card.active { display: block; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #555;
  }
  .form-group input, .form-group select {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e8e8e8;
    border-radius: 10px;
    font-size: 15px;
    transition: border-color 0.3s;
    -webkit-appearance: none;
  }
  .form-group input:focus, .form-group select:focus {
    outline: none;
    border-color: #667eea;
  }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    color: #fff;
  }
  .btn-borrow { background: linear-gradient(135deg, #667eea, #764ba2); }
  .btn-borrow:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102,126,234,0.4); }
  .btn-return { background: linear-gradient(135deg, #11998e, #38ef7d); }
  .btn-return:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(17,153,142,0.4); }

  .section-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 14px;
    color: #333;
    border-left: 4px solid #667eea;
    padding-left: 10px;
  }

  .borrow-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px;
    border: 2px solid #e8e8e8;
    border-radius: 10px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .borrow-item.selected {
    border-color: #11998e;
    background: #f0fdf4;
  }
  .borrow-item .info { flex: 1; }
  .borrow-item .info .book-name { font-weight: 600; font-size: 15px; }
  .borrow-item .info .borrower { font-size: 12px; color: #888; margin-top: 4px; }
  .borrow-item .info .date { font-size: 12px; color: #888; margin-top: 2px; }

  .records-list { margin-top: 12px; }
  .record-item {
    padding: 14px;
    border-bottom: 1px solid #f0f0f0;
  }
  .record-item:last-child { border-bottom: none; }
  .record-item .r-top { display: flex; justify-content: space-between; align-items: center; }
  .record-item .r-book { font-weight: 600; font-size: 15px; }
  .record-item .r-status {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 600;
  }
  .status-borrowed { background: #fff3cd; color: #856404; }
  .status-returned { background: #d4edda; color: #155724; }
  .record-item .r-detail { font-size: 12px; color: #888; margin-top: 6px; line-height: 1.6; }

  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 16px 28px;
    border-radius: 12px;
    font-size: 15px;
    z-index: 1000;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    text-align: center;
    max-width: 80%;
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .toast.success { background: linear-gradient(135deg, #11998e, #38ef7d); }
  .toast.error { background: linear-gradient(135deg, #e44d4d, #f05757); }

  .empty { text-align: center; color: #bbb; padding: 40px 0; font-size: 14px; }
  .loading { text-align: center; color: #888; padding: 20px; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📚 扫码借书</h1>
    <p>借书登记 · 还书登记 · 借阅记录</p>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="borrow" onclick="switchTab('borrow')">📖 借书</div>
    <div class="tab" data-tab="return" onclick="switchTab('return')">📗 还书</div>
    <div class="tab" data-tab="records" onclick="switchTab('records'); loadRecords();">📋 借阅记录</div>
  </div>

  <!-- 借书 -->
  <div class="card active" id="card-borrow">
    <div class="section-title">填写借书信息</div>
    <div class="form-group">
      <label>姓名</label>
      <input type="text" id="borrow-name" placeholder="请输入您的姓名">
    </div>
    <div class="form-group">
      <label>手机号</label>
      <input type="tel" id="borrow-phone" placeholder="请输入手机号" maxlength="11">
    </div>
    <div class="form-group">
      <label>书名</label>
      <input type="text" id="borrow-book" placeholder="请输入要借的书名">
    </div>
    <button class="btn btn-borrow" onclick="doBorrow()">确认借书</button>
  </div>

  <!-- 还书 -->
  <div class="card" id="card-return">
    <div class="section-title">选择要还的书</div>
    <div id="return-list">
      <div class="loading">加载中...</div>
    </div>
    <button class="btn btn-return" id="return-btn" onclick="doReturn()" disabled style="opacity:0.5;margin-top:16px;">确认还书</button>
  </div>

  <!-- 记录 -->
  <div class="card" id="card-records">
    <div class="section-title">所有借阅记录</div>
    <div id="records-list">
      <div class="loading">加载中...</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = ''; // 同域，留空

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
  document.getElementById(`card-${tab}`).classList.add('active');
  if (tab === 'return') loadBorrowed();
}

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function doBorrow() {
  const name = document.getElementById('borrow-name').value.trim();
  const phone = document.getElementById('borrow-phone').value.trim();
  const book = document.getElementById('borrow-book').value.trim();

  if (!name || !phone || !book) { showToast('请填写完整信息', 'error'); return; }
  if (!/^1\d{10}$/.test(phone)) { showToast('请输入正确的手机号', 'error'); return; }

  try {
    const res = await fetch('/api/borrow', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, phone, book })
    });
    const data = await res.json();
    if (data.ok) {
      showToast('✅ 借书成功！', 'success');
      document.getElementById('borrow-name').value = '';
      document.getElementById('borrow-phone').value = '';
      document.getElementById('borrow-book').value = '';
    } else {
      showToast(data.error || '借书失败', 'error');
    }
  } catch(e) {
    showToast('网络错误，请重试', 'error');
  }
}

let selectedRecordId = null;

async function loadBorrowed() {
  const list = document.getElementById('return-list');
  list.innerHTML = '<div class="loading">加载中...</div>';
  selectedRecordId = null;
  document.getElementById('return-btn').disabled = true;
  document.getElementById('return-btn').style.opacity = '0.5';

  try {
    const res = await fetch('/api/records?status=borrowed');
    const records = await res.json();
    if (!records.length) {
      list.innerHTML = '<div class="empty">📭 当前没有未归还的书籍</div>';
      return;
    }
    list.innerHTML = records.map(r => `
      <div class="borrow-item" data-id="${r.id}" onclick="selectReturn(${r.id})">
        <div class="info">
          <div class="book-name">📖 ${r.book_name}</div>
          <div class="borrower">👤 ${r.borrower_name} · ${r.borrower_phone}</div>
          <div class="date">🕐 借于 ${r.borrow_date}</div>
        </div>
      </div>
    `).join('');
  } catch(e) {
    list.innerHTML = '<div class="empty">加载失败，请重试</div>';
  }
}

function selectReturn(id) {
  document.querySelectorAll('.borrow-item').forEach(el => el.classList.remove('selected'));
  document.querySelector(`.borrow-item[data-id="${id}"]`).classList.add('selected');
  selectedRecordId = id;
  document.getElementById('return-btn').disabled = false;
  document.getElementById('return-btn').style.opacity = '1';
}

async function doReturn() {
  if (!selectedRecordId) return;
  try {
    const res = await fetch('/api/return', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: selectedRecordId })
    });
    const data = await res.json();
    if (data.ok) {
      showToast('✅ 还书成功！', 'success');
      loadBorrowed();
    } else {
      showToast(data.error || '还书失败', 'error');
    }
  } catch(e) {
    showToast('网络错误，请重试', 'error');
  }
}

async function loadRecords() {
  const list = document.getElementById('records-list');
  list.innerHTML = '<div class="loading">加载中...</div>';
  try {
    const res = await fetch('/api/records');
    const records = await res.json();
    if (!records.length) {
      list.innerHTML = '<div class="empty">📭 暂无借阅记录</div>';
      return;
    }
    list.innerHTML = `<div class="records-list">${records.map(r => `
      <div class="record-item">
        <div class="r-top">
          <span class="r-book">📖 ${r.book_name}</span>
          <span class="r-status ${r.status === 'borrowed' ? 'status-borrowed' : 'status-returned'}">
            ${r.status === 'borrowed' ? '借阅中' : '已归还'}
          </span>
        </div>
        <div class="r-detail">
          👤 ${r.borrower_name} · 📱 ${r.borrower_phone}<br>
          🕐 借出：${r.borrow_date}${r.return_date ? '<br>✅ 归还：' + r.return_date : ''}
        </div>
      </div>
    `).join('')}</div>`;
  } catch(e) {
    list.innerHTML = '<div class="empty">加载失败，请重试</div>';
  }
}
</script>
</body>
</html>
